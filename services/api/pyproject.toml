[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visionloop-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pillow>=11,<13", "numpy>=2,<3", "scikit-learn>=1.6,<2", "joblib>=1.4,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
tracking = ["mlflow-skinny>=3,<4"]
mlflow-ui = ["mlflow>=3,<4"]

[tool.setuptools.packages.find]
include = ["visionloop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
